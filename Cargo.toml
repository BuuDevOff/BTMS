# BTMS · Buu's Tiles Map Scanner
# Author : BuuDevOff · https://github.com/BuuDevOff
# SPDX-License-Identifier: GPL-3.0-only

[package]
name = "btms"
description = "Export the whole GTA V map as web map tiles from your own game files, offline and GPU-accelerated, with your FiveM server's unprotected map resources"
version = "1.0.0"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-only"
repository = "https://github.com/BuuDevOff/BTMS"
homepage = "https://github.com/BuuDevOff/BTMS"
readme = "README.md"
keywords = ["gta5", "fivem", "map", "tiles", "wgpu"]
categories = ["command-line-utilities", "rendering"]
publish = false
# two executables from the same library: btms (src/main.rs, the command line) and btms-gui
# (src/bin/btms-gui.rs, the same program without a console window, for the Start menu)
default-run = "btms"

[dependencies]
rage-rpf = "0.5.1"
memmap2 = "0.9"
anyhow = "1.0"
sha1 = "0.11"
aes = "0.8"
flate2 = "1.0"
png = "0.18"
bcdec_rs = "0.2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# the WebP tiles (src/tiles/webp.rs): libwebp itself, built from its C sources and linked statically
libwebp-sys = "0.14.4"
# the interface: a small HTTP server on 127.0.0.1, and the native folder and file dialogs
tiny_http = "0.12"
rfd = { version = "0.17", default-features = false }
raw-window-handle = "0.6"
# the drawing on the graphics card (src/render/gpu/): DirectX 12 and Vulkan only
wgpu = { version = "30.0.2", default-features = false, features = ["std", "dx12", "vulkan", "wgsl"] }
bytemuck = "1"

[build-dependencies]
# the executable's icon and version details (build.rs)
winresource = "0.1.34"

[target.'cfg(windows)'.dependencies]
# the interface's view of the machine (src/interface/machine.rs): the graphics cards (DXGI), the
# load of the processor and of the card (the system's performance counters). The version and the
# features wgpu already builds: nothing more is compiled
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_System_Performance", "Win32_System_Threading"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# wgpu-core traces its snatch locks in a thread-local when debug assertions are on. A drawing
# thread that ends drops the card's buffers it kept from a thread-local of its own, after that
# trace is gone, and the whole process aborts. Release builds never trace those locks.
[profile.dev.package.wgpu-core]
debug-assertions = false
