# Dependency updates. The pull request titles follow Conventional Commits ("chore(deps): …",
# "ci(deps): …"), so they pass the title check and never publish a release by themselves.
# Major versions are left out: they change APIs and are upgraded by hand.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
