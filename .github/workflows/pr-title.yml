# Pull requests are squash-merged and their title becomes the commit on main, which release-please
# reads to choose the next version and write the changelog. So the title must follow Conventional
# Commits: "feat: …", "fix: …", "docs: …", "feat!: …" for a breaking change.

name: Pull request title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: Conventional Commits title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            revert
            docs
            refactor
            test
            build
            ci
            style
            chore
