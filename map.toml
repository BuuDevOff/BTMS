# BTMS · Buu's Tiles Map Scanner: what the tiles show.
#
# BTMS reads `map.toml` from the current folder, or the file given with `--config <file>`.
# The values below ARE the defaults: delete any key or section you do not change. An unknown key
# or section is an error, so a typo is reported instead of being ignored.
#
# Full reference: https://github.com/BuuDevOff/BTMS/blob/main/docs/configuration.md


[maps]
# The game loads some maps only when a script asks for them (yachts, the UFO, the states of a
# building a mission changes, multiplayer interiors). BTMS leaves them out, except:
#   - the ones listed here: a placement file's name without folder or extension ("hei_carrier"),
#     a pattern where `*` stands for anything ("h4_*"), or an island of the game ("HeistIsland":
#     the maps the game enables for that island). Case does not matter, and a name matches whole
#     names only ("hei_carrier" does not match "hei_carrier_lod");
#   - the maps a client script of your resources loads by name (RequestIpl);
#   - the maps the game shows by itself at 12:00 in EXTRASUNNY weather;
#   - the LOD parents of a kept map, and (with `fill_holes`) the maps that close a hole.
# `btms groups` lists every on-demand map of your game files and why it is kept or left out.
keep = [
  "hei_carrier",      # the aircraft carrier
  "hei_yacht_heist",  # the heist yacht, off the funfair of Del Perro Pier
  "HeistIsland",      # Cayo Perico ("h4_*" would also keep three yachts off the coast and
                      # the mission variants)

  # More you can add (without them the tile shows a hole or a gap there):
  # "*_mansion_original", "*_props_original",   # three mansion sites, in their original state
  # "hei_ch1_roads_original",                   # a road bend, in its original state
  # "bnkheist_apt_norm",                        # the apartment block with a pool, Paleto Bay
  # "cargoship",                                # the cargo ship moored at the port
  # "*" keeps every on-demand map at once.
]

# Placement files of the game whose path inside the archives (lowercase, `/` between folders)
# contains one of these texts are never drawn. The default leaves out North Yankton, the
# prologue's level; with [] it appears as a snowy area south-east of Los Santos.
exclude_folders = ["/levels/gta5/_prologue/"]

# true: also keep the on-demand maps without which the ground has a hole (the original state of
# a place first, a wrecked state last), then colour in the last holes no map closes (up to
# 2000 m²) from the pixels around them. false: those holes stay empty (transparent).
fill_holes = true


[resources]
# The map resources of your FiveM server. A file under a resource's `stream/` folder wins over
# the game's file of the same name; a new name is added. Each entry is a resource folder (it
# holds `fxmanifest.lua` or `__resource.lua`) or a folder of resources such as `[maps]`,
# searched up to 6 levels deep. When two resources stream the same name, the later one wins:
# this list in order, then resources and files by name. Every resource found is used, whether
# your server starts it or not.
#
# Protected files (FiveM escrow, `FXAP` header) and scrambled models are reported and left out.
# BTMS never decrypts anything.
#
# Write Windows paths in single quotes (`\` is then a plain character). A relative path is taken
# from the current folder.
folders = [
  # 'C:\FXServer\resources\[maps]',
  # 'C:\FXServer\resources\[local]\my-island',
]


[lighting]
# Shading, so that relief and buildings can be read. Each key can be set for one run on the
# command line: --lighting on|off (or --no-lighting), --azimuth <deg>, --elevation <deg>,
# --strength <0-1>, --shadows on|off, --ambient-occlusion <0-1>.

# false: no shading, the textures' own colours (and a faster render).
enabled = true

# Where the sun is, in degrees clockwise from north: 0 north, 90 east, 180 south, 270 west.
# 315 (north-west) is the usual convention of maps.
azimuth = 315.0

# Height of the sun above the horizon, 5 to 90 degrees. Lower: longer shadows, stronger relief.
# No cast shadows at 89 and above.
elevation = 35.0

# Slope shading and cast shadows, 0 (none) to 1 (strong). A full shadow keeps
# 1 - 0.75 x strength of the colour. Softer and easier to read: strength 0.5, elevation 45.
strength = 0.6

# Cast shadows, up to 48 m long.
shadows = true

# Darkening within 3 m of the foot of walls, 0 (none) to 1 (strong).
ambient_occlusion = 0.3


[water]
# true: sea, lakes, rivers, pools and fountains are drawn (deeper is darker), and the sea fills
# the rectangle around the map. false: the ground under the water, and nothing beyond the seabed.
enabled = true
